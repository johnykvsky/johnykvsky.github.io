<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encode and decode Base64 strings locally in your browser.">
  <title>Base64 Encoder / Decoder</title>
  <link rel="icon" type="image/x-icon" href="../img/favicon.png">
  <link rel="stylesheet" href="../assets/toolkit/tool.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Base64 Encoder / Decoder</h1>
      <p>Encode and decode Base64 strings locally in your browser.</p>
    </div>
    <div class="topbar-actions">
      <a class="home-link" href="../index.html">All tools</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Dark</button>
    </div>
  </header>

  <main class="app">
    <section class="toolbar" aria-label="Base64 controls">
      <button id="clearBtn" type="button">Clear</button>
    </section>

    <section id="status" class="status neutral" aria-live="polite">
      Edit either panel to encode or decode.
    </section>

    <section class="editor-grid" aria-label="Base64 encoder and decoder">
      <article class="panel">
        <div class="panel-header">
          <h2>Encoded</h2>
          <div class="panel-actions">
            <button id="copyEncodedBtn" class="plain-button" type="button">Copy</button>
          </div>
        </div>
        <textarea id="encodedInput" spellcheck="false" aria-label="Base64 encoded input">eyJudWxsIjpudWxsLCJib29sZWFuIjpbdHJ1ZSxmYWxzZV0sIm51bWJlciI6WzAsMS41LDJlNCwtMTIzNDU2Nzg5MF0sInN0cmluZ3MiOnsiZmlyc3RuYW1lIjoiSmFuZSIsImxhc3RuYW1lIjoiR3JheSIsImhvYmJpZXMiOlsiWC1SYXkiLCJGbHlpbmciLHsidGVhbXMiOlsiWC1NZW4iLCJNdXRhbnRzIl19XSwiYWRkcmVzcyI6InVua25vd24ifX0=</textarea>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Decoded</h2>
          <div class="panel-actions">
            <button id="copyDecodedBtn" class="plain-button" type="button">Copy</button>
          </div>
        </div>
        <textarea id="decodedInput" spellcheck="false" aria-label="Decoded text input"></textarea>
      </article>
    </section>
  </main>

  <script src="../assets/toolkit/tool.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
