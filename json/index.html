<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Validate, format, minify, clean, and wrap JSON locally in your browser.">
  <title>JSON Formatter</title>
  <link rel="stylesheet" href="../assets/toolkit/tool.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>JSON Formatter</h1>
      <p>Validate, format, minify, clean, and wrap JSON locally in your browser.</p>
    </div>
    <div class="topbar-actions">
      <a class="home-link" href="../index.html">All tools</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Dark</button>
    </div>
  </header>

  <main class="app">
    <section class="toolbar" aria-label="JSON formatter controls">
      <button id="formatBtn" class="primary-button" type="button">Format</button>
      <button id="minifyBtn" type="button">Minify</button>
      <button id="cleanBtn" type="button">Clean</button>
      <button id="wrapBtn" type="button" aria-pressed="false">Word wrap</button>
    </section>

    <section id="status" class="status neutral" aria-live="polite">
      Paste JSON to validate and format.
    </section>

    <section class="editor-grid" aria-label="JSON editor and output">
      <article class="panel">
        <div class="panel-header">
          <h2>Input</h2>
          <button id="clearInputBtn" class="plain-button" type="button">Clear</button>
        </div>
        <textarea id="sourceInput" spellcheck="false" aria-label="JSON input">{"null":null,"boolean":[true,false],"number":[0,1.5,2e4,-1234567890],"strings":{"firstname":"Jane","lastname":"Gray","hobbies":["X-Ray","Flying",{"teams":["X-Men","Mutants"]}],"address":"unknown"}}</textarea>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Output</h2>
          <button id="copyOutputBtn" class="plain-button" type="button">Copy</button>
        </div>
        <pre id="formattedOutput" class="json-output" aria-label="Formatted JSON output"></pre>
      </article>
    </section>
  </main>

  <script src="../assets/toolkit/tool.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
